<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2200" viewBox="0 0 1500 2200">
<!--
  R rarity overlay. Canvas 1500x2200, composited over the base card.

  Safe zones this file respects (see templates/card-base.svg):
    top-left  x 70..400  y 84..210   the rarity badge below - nothing else here
    top-right x 1244..1466 y 84..246  level badge - nothing may cross it
    bottom    y 1620..2124             card text - ornament stays in the two
                                       pockets x<240 / x>1260 below y=2040
  Both badges sit inside the inner ring, so the ring itself never crosses them.
  Nothing is drawn over the character artwork between y 200 and 1740.
-->
<defs>
  <linearGradient id="rarityStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3f7edb"/><stop offset=".5" stop-color="#9ed0ff"/><stop offset="1" stop-color="#3f7edb"/>
  </linearGradient>
</defs>
<rect x="16" y="16" width="1468" height="2168" rx="64" fill="none" stroke="#08080e" stroke-width="26"/>
<rect x="36" y="36" width="1428" height="2128" rx="50" fill="none" stroke="url(#rarityStroke)" stroke-width="12"/>
<rect x="60" y="60" width="1380" height="2080" rx="34" fill="none" stroke="#9ed0ff" stroke-width="3" stroke-opacity=".8"/>

<path d="M34 2090 L34 2166 L164 2166" fill="none" stroke="url(#rarityStroke)" stroke-width="10"/>
<path d="M1466 2090 L1466 2166 L1336 2166" fill="none" stroke="url(#rarityStroke)" stroke-width="10"/>
<g id="rarity-badge" transform="translate(76 88)">
<rect width="168" height="116" rx="38" fill="#0d0d14" stroke="url(#rarityStroke)" stroke-width="6"/>
  <text x="84" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" fill="#9ed0ff">R</text>
</g>
</svg>
