<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2200" viewBox="0 0 1500 2200">
<!--
  SSR rarity overlay. Canvas 1500x2200, composited over the base card.

  Safe zones this file respects (see templates/card-base.svg):
    top-left  x 70..400  y 84..210   the rarity badge below - nothing else here
    top-right x 1244..1466 y 84..246  level badge - nothing may cross it
    bottom    y 1620..2124             card text - ornament stays in the two
                                       pockets x<240 / x>1260 below y=2040
  Both badges sit inside the inner ring, so the ring itself never crosses them.
  Nothing is drawn over the character artwork between y 200 and 1740.
-->
<defs>
  <linearGradient id="rarityStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#f5c451"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#d946ef" flood-opacity=".7"/>
    <feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="16" y="16" width="1468" height="2168" rx="64" fill="none" stroke="#08080e" stroke-width="26"/>
<rect x="36" y="36" width="1428" height="2128" rx="50" fill="none" stroke="url(#rarityStroke)" stroke-width="16" filter="url(#glow)"/>
<rect x="60" y="60" width="1380" height="2080" rx="34" fill="none" stroke="#f5c451" stroke-width="4"/>
<rect x="74" y="74" width="1352" height="2052" rx="28" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity=".7"/>
<path d="M580 34 L920 34" stroke="url(#rarityStroke)" stroke-width="10" stroke-linecap="round"/>
<path d="M704 36 L750 8 L796 36 L750 64 Z" fill="url(#rarityStroke)"/>
<path d="M34 2044 L34 2166 L240 2166" fill="none" stroke="url(#rarityStroke)" stroke-width="12"/>
<path d="M1466 2044 L1466 2166 L1260 2166" fill="none" stroke="url(#rarityStroke)" stroke-width="12"/>
<path d="M60 2066 L60 2142 L194 2142" fill="none" stroke="#f5c451" stroke-width="4" stroke-opacity="0.85"/>
<path d="M1440 2066 L1440 2142 L1306 2142" fill="none" stroke="#f5c451" stroke-width="4" stroke-opacity="0.85"/>
<path d="M126 2104 l30 -30 l30 30 l-30 30 Z" fill="url(#rarityStroke)"/>
<path d="M1374 2104 l-30 -30 l-30 30 l30 30 Z" fill="url(#rarityStroke)"/>
<g id="rarity-badge" transform="translate(76 88)">
<rect width="268" height="116" rx="38" fill="#0d0d14" stroke="url(#rarityStroke)" stroke-width="6"/>
  <text x="134" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" fill="#f5c451">SSR</text>
</g>
</svg>
