<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2200" viewBox="0 0 1500 2200">
<!--
  SR rarity overlay. Canvas 1500x2200, composited over the base card.

  Safe zones this file respects (see templates/card-base.svg):
    top-left  x 70..400  y 84..210   the rarity badge below - nothing else here
    top-right x 1244..1466 y 84..246  level badge - nothing may cross it
    bottom    y 1620..2124             card text - ornament stays in the two
                                       pockets x<240 / x>1260 below y=2040
  Both badges sit inside the inner ring, so the ring itself never crosses them.
  Nothing is drawn over the character artwork between y 200 and 1740.
-->
<defs>
  <linearGradient id="rarityStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#d8b4fe"/><stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#c084fc" flood-opacity=".7"/>
    <feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="16" y="16" width="1468" height="2168" rx="64" fill="none" stroke="#08080e" stroke-width="26"/>
<rect x="36" y="36" width="1428" height="2128" rx="50" fill="none" stroke="url(#rarityStroke)" stroke-width="14" filter="url(#glow)"/>
<rect x="60" y="60" width="1380" height="2080" rx="34" fill="none" stroke="#d8b4fe" stroke-width="3" stroke-opacity=".8"/>
<path d="M600 30 L900 30" stroke="url(#rarityStroke)" stroke-width="12" stroke-linecap="round"/>
<path d="M34 2044 L34 2166 L240 2166" fill="none" stroke="url(#rarityStroke)" stroke-width="12"/>
<path d="M1466 2044 L1466 2166 L1260 2166" fill="none" stroke="url(#rarityStroke)" stroke-width="12"/>
<path d="M60 2066 L60 2142 L194 2142" fill="none" stroke="#d8b4fe" stroke-width="4" stroke-opacity="0.85"/>
<path d="M1440 2066 L1440 2142 L1306 2142" fill="none" stroke="#d8b4fe" stroke-width="4" stroke-opacity="0.85"/>
<g id="rarity-badge" transform="translate(76 88)">
<rect width="214" height="116" rx="38" fill="#0d0d14" stroke="url(#rarityStroke)" stroke-width="6"/>
  <text x="107" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" fill="#d8b4fe">SR</text>
</g>
</svg>
