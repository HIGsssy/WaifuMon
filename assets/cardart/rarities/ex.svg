<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2200" viewBox="0 0 1500 2200">
<!--
  EX rarity overlay. Canvas 1500x2200, composited over the base card.

  Safe zones this file respects (see templates/card-base.svg):
    top-left  x 70..400  y 84..210   the rarity badge below - nothing else here
    top-right x 1244..1466 y 84..246  level badge - nothing may cross it
    bottom    y 1620..2124             card text - ornament stays in the two
                                       pockets x<240 / x>1260 below y=2040
  Both badges sit inside the inner ring, so the ring itself never crosses them.
  Nothing is drawn over the character artwork between y 200 and 1740.
-->
<defs>
  <linearGradient id="rarityStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dc2626"/><stop offset=".5" stop-color="#fde68a"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="13" result="b"/><feFlood flood-color="#fca5a5" flood-opacity=".7"/>
    <feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<path d="M80 16 H1420 A64 64 0 0 1 1484 80 V2092 L1392 2184 H108 L16 2092 V80 A64 64 0 0 1 80 16 Z" fill="none" stroke="#08080e" stroke-width="26"/>
<path d="M86 36 H1414 A50 50 0 0 1 1464 86 V2072 L1372 2164 H128 L36 2072 V86 A50 50 0 0 1 86 36 Z" fill="none" stroke="url(#rarityStroke)" stroke-width="18" filter="url(#glow)"/>
<path d="M94 60 H1406 A34 34 0 0 1 1440 94 V2048 L1348 2140 H152 L60 2048 V94 A34 34 0 0 1 94 60 Z" fill="none" stroke="#fde68a" stroke-width="5" stroke-dasharray="34 18"/>
<path d="M540 22 L680 22 L716 62 L784 62 L820 22 L960 22"
  fill="none" stroke="url(#rarityStroke)" stroke-width="14"/>
<path d="M34 2044 L34 2100 L100 2166 L240 2166" fill="none" stroke="url(#rarityStroke)" stroke-width="14"/>
<path d="M1466 2044 L1466 2100 L1400 2166 L1260 2166" fill="none" stroke="url(#rarityStroke)" stroke-width="14"/>
<path d="M74 2136 l44 0 l0 -44" fill="none" stroke="#fde68a" stroke-width="6"/>
<path d="M1426 2136 l-44 0 l0 -44" fill="none" stroke="#fde68a" stroke-width="6"/>
<g id="rarity-badge" transform="translate(76 88)">
<path d="M0 0 L214 0 L214 74 L176 116 L0 116 Z" fill="#0d0d14" stroke="url(#rarityStroke)" stroke-width="6"/>
  <text x="107" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" fill="#fde68a">EX</text>
</g>
</svg>
