<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2200" viewBox="0 0 1500 2200">
  <!--
    Canvas 1500x2200 (~0.6818) against source artwork at 1248x1824 (13:19,
    ~0.6842). The art is FULL BLEED: it fills the whole card and the frame,
    badges and text sit over it. That costs 1.5% of width and nothing of
    height. An inset art window on this canvas would instead throw away ~11%
    of the height, and these compositions put ears against the top edge and
    boots against the bottom, so that 11% is anatomy.

    FUNCTIONAL ZONES — rarity overlays must not draw into these:
      top-left    x  70..400   y  84..210   the overlay's own rarity badge
      top-right   x 1244..1466 y  84..246   level badge (drawn here)
      bottom      y 1620..2124, full width  name, classification, ability, credits
    Both badges sit *inside* the inner decorative ring (y=60) rather than in
    the corners, because a corner badge and a corner flourish cannot share a
    corner - that collision is what Phase 4 kept hitting. Overlays own the
    border rings, the top-centre band between the badges (x 400..1240), and the
    two bottom pockets (x<240 / x>1260, below y=2040).
  -->
  <defs>
    <clipPath id="cardClip"><rect x="26" y="26" width="1448" height="2148" rx="46"/></clipPath>

    <!-- Bottom scrim. The art is legs and background down here, not faces. -->
    <linearGradient id="infoScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070c" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#07070c" stop-opacity="0.82"/>
      <stop offset="0.6" stop-color="#07070c" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#07070c" stop-opacity="1"/>
    </linearGradient>

    <!-- Just enough darkening under the top badges to keep them legible. -->
    <linearGradient id="topScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05050a" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#05050a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7fa" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e4e4ea" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect id="card-background" x="0" y="0" width="1500" height="2200" rx="64" fill="#0b0b12"/>

  <g clip-path="url(#cardClip)">
    <rect x="26" y="26" width="1448" height="2148" fill="#171720"/>
    <image id="character-art" href="character-art.png" x="26" y="26" width="1448" height="2148"
           preserveAspectRatio="xMidYMid slice"/>
    <rect x="26" y="26" width="1448" height="300" fill="url(#topScrim)"/>
    <rect x="26" y="1380" width="1448" height="794" fill="url(#infoScrim)"/>
  </g>

  <!-- Level. Functional, so it is legible, but it never competes with the name. -->
  <g id="level-badge">
    <rect x="1250" y="88" width="210" height="152" rx="32" fill="#0b0b12" fill-opacity="0.72"
          stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
    <text x="1355" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="30" font-weight="700" fill="#c9c9d6">LV.</text>
    <text id="level" x="1355" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="82" font-weight="800" fill="#f4f4f8">12</text>
  </g>

  <g id="identity">
    <text id="character-name" x="750" y="1664" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="800"
          fill="#f7f7fb">CHARACTER NAME</text>
    <text id="character-subtitle" x="750" y="1716" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#b9b9c9">Subtitle / Epithet</text>
  </g>

  <!-- Classification. Icons carry this at thumbnail size; labels are secondary. -->
  <g id="classification">
    <rect x="60" y="1742" width="1380" height="132" rx="30" fill="url(#panelGrad)" filter="url(#softShadow)"/>
    <g id="race-slot">
      <circle cx="130" cy="1808" r="50" fill="#16161f"/>
      <g id="race-icon" transform="translate(80 1758) scale(1.0)"/>
      <text id="race-label" x="196" y="1821" font-family="Arial, Helvetica, sans-serif"
            font-size="32" font-weight="800" fill="#15151c">RACE</text>
    </g>
    <line x1="452" y1="1769" x2="452" y2="1847" stroke="#15151c" stroke-opacity="0.18" stroke-width="3"/>
    <g id="affinity-slot">
      <circle cx="520" cy="1808" r="50" fill="#16161f"/>
      <g id="affinity-icon" transform="translate(470 1758) scale(1.0)"/>
      <text id="affinity-label" x="586" y="1792" font-family="Arial, Helvetica, sans-serif"
            font-size="30" font-weight="800" fill="#15151c">DOMINANT</text>
      <text id="affinity-description" x="586" y="1830" font-family="Arial, Helvetica, sans-serif"
            font-size="23" fill="#3a3a46">Affinity description goes here.</text>
      <text id="affinity-description-2" x="586" y="1860" font-family="Arial, Helvetica, sans-serif"
            font-size="23" fill="#3a3a46">Optional second line.</text>
    </g>
  </g>

  <g id="ability-block">
    <rect x="60" y="1896" width="1380" height="140" rx="30" fill="url(#panelGrad)" filter="url(#softShadow)"/>
    <circle cx="128" cy="1966" r="44" fill="#16161f"/>
    <!--
      Vector sparkle, not a glyph: the embedded fonts have no coverage for
      U+2726, so a text element renders as a missing-glyph box. Absolute
      coords, centred on the disc at (128, 1992) - no transform.
    -->
    <path id="ability-icon" d="M128 1930 C132 1949 143 1962 163 1966 C143 1970 132 1983 128 2002 C124 1983 113 1970 93 1966 C113 1962 124 1949 128 1930 Z" fill="#ffffff"/>
    <text id="ability-name" x="196" y="1944" font-family="Arial, Helvetica, sans-serif"
          font-size="38" font-weight="700" fill="#15151c">Ability Name</text>
    <text id="ability-text" x="196" y="1986" font-family="Arial, Helvetica, sans-serif"
          font-size="27" fill="#33333f">Ability description goes here.</text>
    <text id="ability-text-2" x="196" y="2020" font-family="Arial, Helvetica, sans-serif"
          font-size="27" fill="#33333f"></text>
  </g>

  <!--
    Footer sits inside the innermost frame line (y=2174) and clear of the
    corner flourishes, which own the outer 220px at this height.
  -->
  <g id="footer">
    <text id="flavor-quote" x="750" y="2070" text-anchor="middle" font-family="Georgia, serif"
          font-style="italic" font-size="30" fill="#e6e6ef">“Flavor text or quote.”</text>
    <text id="artist-credit" x="250" y="2112" font-family="Arial, Helvetica, sans-serif"
          font-size="24" fill="#c2c2d0">Artist - Artist Name</text>
    <text id="brand" x="750" y="2114" text-anchor="middle" font-family="Georgia, serif"
          font-size="32" font-weight="700" fill="#d8d8e4">WAIFUMON</text>
    <text id="card-number" x="1250" y="2112" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
          font-size="24" fill="#c2c2d0">012/100</text>
  </g>
</svg>
