<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400">
  <defs>
    <clipPath id="artClip"><rect x="40" y="155" width="920" height="920" rx="34"/></clipPath>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#e9e9e9" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect id="card-background" x="0" y="0" width="1000" height="1400" rx="48" fill="#15151d"/>

  <g id="artwork" clip-path="url(#artClip)">
    <rect x="40" y="155" width="920" height="920" fill="#cfd3d8"/>
    <image id="character-art" href="character-art.png" x="40" y="155" width="920" height="920"
           preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g id="header">
    <rect x="220" y="28" width="600" height="110" rx="22" fill="url(#panelGrad)" filter="url(#softShadow)"/>
    <text id="character-name" x="500" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="54" font-weight="700" fill="#111">CHARACTER NAME</text>
    <text id="character-subtitle" x="500" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="22" fill="#333">Subtitle / Epithet</text>
    <g id="level-badge">
      <rect x="830" y="28" width="130" height="110" rx="22" fill="url(#panelGrad)" filter="url(#softShadow)"/>
      <text x="895" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#333">LV.</text>
      <text id="level" x="895" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#111">12</text>
    </g>
  </g>

  <g id="race-slot" transform="translate(44 38)">
    <circle cx="75" cy="75" r="68" fill="#f3f3f3" stroke="#333" stroke-width="5"/>
    <g id="race-icon" transform="translate(28 28) scale(.94)"/>
    <rect x="5" y="145" width="140" height="38" rx="14" fill="#1e1e1e"/>
    <text id="race-label" x="75" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="18" font-weight="700" fill="#fff">RACE</text>
  </g>

  <g id="lower-info">
    <rect x="58" y="1090" width="884" height="92" rx="20" fill="url(#panelGrad)" filter="url(#softShadow)"/>
    <g id="affinity-slot" transform="translate(72 1100)">
      <circle cx="34" cy="34" r="30" fill="#222"/>
      <g id="affinity-icon" transform="translate(9 9) scale(.5)"/>
      <text x="78" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#555">AFFINITY</text>
      <text id="affinity-label" x="78" y="53" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#111">DOMINANT</text>
    </g>
    <text id="affinity-description" x="430" y="1133" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">Affinity description goes here.</text>
    <text id="affinity-description-2" x="430" y="1160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">Optional second line.</text>

    <g id="ability-block">
      <rect x="58" y="1196" width="884" height="108" rx="20" fill="url(#panelGrad)" filter="url(#softShadow)"/>
      <circle cx="105" cy="1250" r="31" fill="#222"/>
      <!-- Vector sparkle, not a ✦ glyph: the embedded fonts have no coverage for
           U+2726, so a text element renders as a missing-glyph box. Absolute
           coords, centred on the disc at (105, 1250) — no transform. -->
      <path id="ability-icon" d="M105 1224 C108 1238 116 1247 130 1250 C116 1253 108 1262 105 1276 C102 1262 94 1253 80 1250 C94 1247 102 1238 105 1224 Z" fill="#ffffff"/>
      <text id="ability-name" x="155" y="1234" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#111">Ability Name</text>
      <text id="ability-text" x="155" y="1266" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222">Ability description goes here.</text>
      <text id="ability-text-2" x="155" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222"></text>
    </g>
  </g>

  <!-- Footer lives inside the innermost frame line (y=1360) and clear of the
       corner flourishes, which sweep in to x≈175 / x≈825 below y≈1300. Keep the
       credit row's baseline at 1350 and its ends within x 190…810. -->
  <g id="footer">
    <text id="flavor-quote" x="500" y="1324" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
          font-size="21" fill="#f5f5f5">“Flavor text or quote.”</text>
    <text id="artist-credit" x="190" y="1350" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f1f1">Artist - Artist Name</text>
    <text id="brand" x="500" y="1350" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f1f1f1">WAIFUMON</text>
    <text id="card-number" x="810" y="1350" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f1f1">012/100</text>
  </g>
</svg>