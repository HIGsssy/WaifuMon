# Postgres observability settings for STAGING ONLY.
#
# Mounted into the postgres container and pulled in with `-c config_file=` or an
# `include`; docs/metrics-and-observability.md has the exact wiring for the
# host's own docker-compose.stage.yml, which is deliberately untracked.
#
# Nothing here changes query results, planning or durability. Every setting is
# either a statistics collector or a logging threshold, so the worst case of
# getting one wrong is log volume rather than data.
#
# WHY STAGE ONLY: pg_stat_statements adds a small per-statement bookkeeping cost
# and a shared-memory allocation, and `log_min_duration_statement` at 200ms will
# write a line for every slow query. Both are the right trade during a capacity
# test and neither is something to carry in production without deciding to.

# --- pg_stat_statements ------------------------------------------------------
#
# Requires a RESTART, not a reload: shared_preload_libraries is only read at
# startup. The extension itself also has to be created once per database —
# initdb/10-observability.sql does that on a fresh volume, and the doc gives the
# one-liner for an existing one.
shared_preload_libraries = 'pg_stat_statements'

# Distinct normalised statements tracked. The default 5000 is ample for this
# workload — the schema has ~40 tables and the query set is closed — but the
# card and collection paths generate a wide family of parameterised reads and
# eviction would silently drop the tail we are trying to measure.
pg_stat_statements.max = 10000

# `all` rather than `top`, so statements inside a function or a DO block are
# counted too. The expedition and boss payout paths do their work in
# transactions with several statements each, and `top` would attribute the whole
# transaction to one entry.
pg_stat_statements.track = all

# Count planning time separately from execution. Worth having on: a query whose
# execution is fast but whose planning is not looks identical to a fast query
# without this, and repeated re-planning is a real cost under a burst.
pg_stat_statements.track_planning = on

# --- Slow queries -----------------------------------------------------------
#
# 200ms. Chosen against what this application's queries actually do rather than
# from habit: the gameplay paths are single-row indexed reads and short
# player-scoped transactions that should complete in single-digit milliseconds,
# so 200ms is already far into "something is wrong" territory while staying high
# enough that a normal test run does not write a line per request.
#
# Lower it to 50 for a targeted investigation; do not lower it to 0 during a
# 50-player run unless the intent is to capture every statement, which will be
# tens of thousands of lines and will itself perturb the measurement.
log_min_duration_statement = 200ms

# --- Lock contention --------------------------------------------------------
#
# The audit identified capture and expedition resolution as the paths that take
# row locks (`SELECT … FOR UPDATE` on an encounter, the conditional UPDATE that
# claims a due mission). Those are per-player and should never contend across
# players; `log_lock_waits` is what proves that empirically instead of by
# reading the code.
#
# A wait is only logged once it exceeds deadlock_timeout, so that value doubles
# as the lock-wait threshold. 500ms is well above any legitimate wait here.
log_lock_waits = on
deadlock_timeout = 500ms

# Autovacuum runs that take real time, so a mid-test latency spike can be
# attributed to one rather than guessed at.
log_autovacuum_min_duration = 1s

# Statement-level timing for the temp/IO figures EXPLAIN-free analysis needs.
track_io_timing = on
# Per-function statistics — cheap, and the only way to see PL/pgSQL cost if any
# is introduced later.
track_functions = pl

# --- Connection visibility --------------------------------------------------
#
# The application pool is capped at 10 (src/db/client.ts) and that ceiling is
# NOT being changed as part of this work. Logging connects and disconnects is
# how the test confirms whether the pool is actually saturating — `waitingCount`
# from /metrics is the app's view, and this is the server's.
log_connections = on
log_disconnections = on

# Prefix every line with timestamp, pid, user, database and application_name so
# a log can be correlated with a /metrics window and with a specific client.
log_line_prefix = '%m [%p] %q%u@%d app=%a '
