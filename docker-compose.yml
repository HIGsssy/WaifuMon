services:
  waifumon-bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ASSETS_DIR: /app/assets
      CONTENT_DIR: /app/content
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # The image's `node` user is uid/gid 1000, which matches the first login
    # user on most Linux hosts — so the bind-mounted content/ below is writable
    # with no chown. If your deploy user is not 1000, set WAIFUMON_UID and
    # WAIFUMON_GID in .env to `id -u` / `id -g` instead of chowning the repo.
    user: '${WAIFUMON_UID:-1000}:${WAIFUMON_GID:-1000}'
    volumes:
      - ./assets:/app/assets:ro
      # Read-write on purpose: the admin panel writes content edits and
      # timestamped backups here. Mounted rather than baked in so edits survive
      # a rebuild and stay visible to git. Harmless when the panel is disabled.
      - ./content:/app/content
    # Admin web panel. Two separate binds have to line up, both driven from .env:
    #   ADMIN_WEB_HOST         the bind *inside* the container's network
    #                          namespace. Must be 0.0.0.0 under Docker —
    #                          loopback there is unreachable from outside it.
    #   ADMIN_WEB_PUBLISH_HOST the host address the port is published on. This
    #                          is the real security boundary. Defaults to
    #                          loopback (SSH-tunnel only); set it to the host's
    #                          tailnet IP for Tailscale. Never set it to
    #                          0.0.0.0 — published ports are inserted ahead of
    #                          ufw/iptables, so that is publicly reachable even
    #                          with a firewall enabled.
    ports:
      - '${ADMIN_WEB_PUBLISH_HOST:-127.0.0.1}:${ADMIN_WEB_PORT:-3111}:${ADMIN_WEB_PORT:-3111}'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - waifumon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not port-mapped to the host by default; expose 5432 in an override file
    # for local debugging only.

volumes:
  waifumon-pgdata:
