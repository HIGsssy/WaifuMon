services:
  # One-shot: initialize ownership on the named card-cache volume so the app
  # can write to it as the `node` user (uid 1000 by default). Named volumes are
  # created root-owned on first use; this fixes that, and is a no-op on every
  # subsequent start because the ownership is already correct. Runs as root
  # because chown requires it — but does nothing except chown and exit, and
  # never touches the code, the database or the network. See
  # docs/card-rendering-deployment.md.
  waifumon-card-cache-init:
    image: alpine:3
    user: '0:0'
    command:
      - sh
      - -c
      - 'chown ${WAIFUMON_UID:-1000}:${WAIFUMON_GID:-1000} /cache && chmod 755 /cache'
    volumes:
      - waifumon-card-cache:/cache
    restart: 'no'

  waifumon-bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ASSETS_DIR: /app/assets
      CONTENT_DIR: /app/content
      # Docker-internal bind. Host publication below remains loopback by
      # default; this only lets the Portal web container reach the API.
      PLATFORM_API_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      # Blocks the bot until the cache volume is chowned to the app's uid/gid.
      # If that step fails, the bot never starts — better than starting into an
      # unwritable cache and logging EROFS/EACCES on every render.
      waifumon-card-cache-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # The image's `node` user is uid/gid 1000, which matches the first login
    # user on most Linux hosts — so the bind-mounted content/ below is writable
    # with no chown. If your deploy user is not 1000, set WAIFUMON_UID and
    # WAIFUMON_GID in .env to `id -u` / `id -g` instead of chowning the repo.
    # The same values drive waifumon-card-cache-init above, so the card cache
    # is always writable by whichever uid this container runs as.
    user: '${WAIFUMON_UID:-1000}:${WAIFUMON_GID:-1000}'
    volumes:
      - ./assets:/app/assets:ro
      # A writable overlay on top of the read-only assets bind. The renderer
      # only ever writes under this subpath, so the rest of assets/ stays
      # read-only. Named volume so the WebP cache survives compose down/up and
      # container recreation without being baked into the image.
      # docs/card-rendering-deployment.md.
      - waifumon-card-cache:/app/assets/.card-cache
      # Read-write on purpose: the admin panel writes content edits and
      # timestamped backups here. Mounted rather than baked in so edits survive
      # a rebuild and stay visible to git. Harmless when the panel is disabled.
      - ./content:/app/content
    # Admin web panel. Two separate binds have to line up, both driven from .env:
    #   ADMIN_WEB_HOST         the bind *inside* the container's network
    #                          namespace. Must be 0.0.0.0 under Docker —
    #                          loopback there is unreachable from outside it.
    #   ADMIN_WEB_PUBLISH_HOST the host address the port is published on. This
    #                          is the real security boundary. Defaults to
    #                          loopback (SSH-tunnel only); set it to the host's
    #                          tailnet IP for Tailscale. Never set it to
    #                          0.0.0.0 — published ports are inserted ahead of
    #                          ufw/iptables, so that is publicly reachable even
    #                          with a firewall enabled.
    #
    # Platform API (docs/platform-api.md). Same two-bind rule as above, plus a
    # third value that is not a bind at all:
    #   PLATFORM_API_HOST         must be 0.0.0.0 under Docker
    #   PLATFORM_API_PUBLISH_HOST the real boundary; loopback by default,
    #                             set it to the host's tailnet IP for Tailscale
    #   PLATFORM_API_PUBLIC_URL   how clients dial it — the URL the OpenAPI
    #                             document advertises, so Swagger UI's "Try it
    #                             out" never calls the unroutable 0.0.0.0 bind.
    #                             Should match PLATFORM_API_PUBLISH_HOST.
    # Publishing the port is harmless while PLATFORM_API_ENABLED=false — nothing
    # is listening inside the container, so the mapping simply refuses connections.
    ports:
      - '${ADMIN_WEB_PUBLISH_HOST:-127.0.0.1}:${ADMIN_WEB_PORT:-3111}:${ADMIN_WEB_PORT:-3111}'
      - '${PLATFORM_API_PUBLISH_HOST:-127.0.0.1}:${PLATFORM_API_PORT:-3120}:${PLATFORM_API_PORT:-3120}'

  waifumon-portal:
    # Opt-in, and the opt-in is about the *build*, not the run.
    #
    # `docker compose up --build` with no service named builds every service
    # that has a `build:` section before it starts anything. The Portal's build
    # runs `npm ci`, `npm run build` and `npm run verify:bundle` (portal/
    # Dockerfile), so a TypeScript error in the SPA, a lockfile drift, a
    # registry blip or a verify:bundle rejection would abort the whole `up` —
    # and the bot and Postgres, which have nothing to do with any of it, would
    # never start. A profile takes this service out of every unqualified
    # compose command, build included, which is the only thing that actually
    # decouples the two. `depends_on` cannot: it orders startup, and by then
    # the build has already failed.
    #
    # Naming the service still works and still builds it — Compose activates a
    # profile automatically when you target its service, so
    # `docker compose up --build waifumon-portal` and
    # `docker compose --profile portal up -d --build` both bring it up.
    profiles: ['portal']
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        VITE_PLATFORM_API_URL: /api
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-}
        VITE_DEFAULT_PLAYER_ID: ${VITE_DEFAULT_PLAYER_ID:-}
        VITE_DEFAULT_DISCORD_GUILD_ID: ${VITE_DEFAULT_DISCORD_GUILD_ID:-}
        VITE_DEFAULT_DISCORD_USER_ID: ${VITE_DEFAULT_DISCORD_USER_ID:-}
        VITE_IMAGE_PROVIDERS: ${VITE_IMAGE_PROVIDERS:-}
        VITE_ASSET_CDN_URL: ${VITE_ASSET_CDN_URL:-}
    environment:
      PORTAL_API_UPSTREAM: http://waifumon-bot:${PLATFORM_API_PORT:-3120}
      # Set to https when Cloudflare terminates TLS in front of the tunnel.
      PORTAL_FORWARDED_PROTO: ${PORTAL_FORWARDED_PROTO:-http}
    # Load-bearing, and deliberately the weakest condition that works.
    # nginx.conf.template proxies to a literal `${PORTAL_API_UPSTREAM}` host
    # with no `resolver` directive, so Nginx resolves `waifumon-bot` when it
    # loads its config and exits with "host not found in upstream" if the name
    # does not exist yet. This edge is what guarantees the container is there
    # to resolve. `service_started` rather than `service_healthy` on purpose:
    # the Portal needs the name, not a ready API — it serves the static SPA
    # immediately and returns 502 on /api until the bot finishes booting.
    depends_on:
      waifumon-bot:
        condition: service_started
    # One-way: nothing in the bot/postgres/card-cache graph depends on this
    # service, so a Portal that crash-loops or never builds cannot stop, block
    # or restart the bot.
    restart: unless-stopped
    ports:
      - '${PORTAL_WEB_PUBLISH_HOST:-127.0.0.1}:${PORTAL_WEB_PORT:-3130}:8080'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - waifumon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not port-mapped to the host by default; expose 5432 in an override file
    # for local debugging only.

volumes:
  waifumon-pgdata:
  # Card renderer's WebP cache. Overlays /app/assets/.card-cache/ so writes
  # succeed while the rest of /app/assets stays read-only. Persists across
  # `docker compose down` / `up`; a `docker compose down -v` (or an explicit
  # `docker volume rm`) discards it, and the renderer rebuilds it on demand.
  waifumon-card-cache:
