services:
  waifumon-bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ASSETS_DIR: /app/assets
      CONTENT_DIR: /app/content
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./assets:/app/assets:ro
      # Admin web panel only: content is baked into the image, so bind-mount it
      # read-write if admins should be able to save edits. See docs/admin-web.md.
      # - ./content:/app/content
    # Admin web panel only: inside a container the panel must bind 0.0.0.0 to be
    # reachable, so add ADMIN_WEB_HOST: 0.0.0.0 to the environment block above
    # and publish the port to the *host's* loopback and nowhere else:
    # ports:
    #   - '127.0.0.1:3111:3111'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - waifumon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not port-mapped to the host by default; expose 5432 in an override file
    # for local debugging only.

volumes:
  waifumon-pgdata:
