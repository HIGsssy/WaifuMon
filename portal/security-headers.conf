# Browser security headers — the single source of truth for the public edge.
#
# Included rather than inherited, because nginx's `add_header` inheritance is a
# trap: "these directives are inherited from the previous configuration level if
# and only if there are no add_header directives defined on the current level."
# A location that sets so much as its own `Cache-Control` therefore silently
# drops *every* server-level security header. That is how the SPA document —
# the one response that most needs X-Frame-Options — ended up shipping with
# none of them while the JSON API shipped two of each.
#
# So: no server-level `add_header` at all. Every location that emits headers
# includes this file, and the set is identical everywhere by construction.
#
# On the proxied locations this pairs with `proxy_hide_header` for the same
# three names, so the upstream's @fastify/helmet values are stripped before
# these are applied and exactly one value reaches the browser. Helmet itself is
# untouched — it still protects the Platform API on its own loopback port,
# where there is no Nginx in front to do it.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
